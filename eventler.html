<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UjukhanBot | Etkinlik Merkezi</title>
    <style>
        @font-face {
            font-family: 'Hemi Head';
            src: url('hemi head bd it.ttf') format('truetype');
            font-weight: bold;
            font-style: italic;
        }
        :root { 
            --neon-cyan: #00f2ff; --neon-gold: #ffd700; --neon-pink: #e91e63; --neon-green: #00ff88; --neon-purple: #bc13fe;
            --bg-dark: #05070a; --main-font: 'Hemi Head', sans-serif; 
        }
        body { background-color: var(--bg-dark); color: #fff; font-family: var(--main-font); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; background-image: radial-gradient(circle at center, #0d121d 0%, #05070a 100%); }
        header { text-align: center; padding: 40px 0; width: 100%; border-bottom: 2px solid var(--neon-purple); background: rgba(0,0,0,0.5); position: relative; }
        header h1 { font-size: 55px; margin: 0; text-shadow: 0 0 20px var(--neon-purple); letter-spacing: 3px; font-style: italic; }
        .home-link { position: absolute; top: 20px; right: 20px; text-decoration: none; color: var(--neon-purple); border: 1px solid var(--neon-purple); padding: 8px 15px; border-radius: 5px; font-size: 14px; transition: 0.3s; }
        .home-link:hover { background: var(--neon-purple); color: #fff; box-shadow: 0 0 15px var(--neon-purple); }
        .content-container { width: 90%; max-width: 1100px; padding: 20px; margin-top: 30px; }
        .terminal-box { background: #0d1117; border-left: 5px solid var(--neon-purple); padding: 25px; margin-bottom: 30px; border-radius: 4px; animation: fadeIn 0.6s ease forwards; }
        .box-title { display: block; font-size: 28px; color: #fff; margin-bottom: 15px; letter-spacing: 2px; font-style: italic; text-shadow: 0 0 10px var(--neon-purple); }
        .box-text { font-family: 'Segoe UI', sans-serif; color: #aaa; line-height: 1.8; font-size: 16px; }
        .step-item { margin-bottom: 20px; padding-left: 15px; border-left: 2px solid #333; }
        .highlight { color: var(--neon-cyan); font-weight: bold; }
        .reward { color: var(--neon-gold); font-weight: bold; }
        .danger { color: var(--neon-pink); font-weight: bold; }
        .val-text { color: var(--neon-cyan); font-weight: normal; }
        .coming-soon { text-align: center; padding: 40px; border: 2px dashed #333; color: #555; font-size: 24px; letter-spacing: 5px; font-style: italic; border-radius: 10px; margin-top: 50px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .footer { padding: 40px; color: #333; letter-spacing: 4px; font-size: 11px; font-style: italic; text-align: center; }
    </style>
</head>
<body>
    <header>
        <a href="faq.html" class="home-link">← SİSTEME DÖN</a>
        <h1>ETKİNLİK MERKEZİ</h1>
    </header>
    <div class="content-container" id="events-container"></div>
    <div class="content-container" style="margin-top:0; padding-top:0;">
        <div class="coming-soon">🚀 YENİ ETKİNLİKLER YAKINDA SİSTEME DAHİL EDİLECEKTİR...</div>
    </div>
    <div class="footer">UJUKHANBOT EVENT MODULE // v2.0.1 // STABLE CONNECTION</div>

    <script>
        function formatText(text) { if(!text) return ''; return text.replace(/\n/g, '<br>'); }
        async function loadData() {
            try {
                const response = await fetch('./eventler.json');
                const eventData = await response.json();
                renderEvents(eventData);
            } catch(e) { console.error("eventler.json yüklenemedi!"); }
        }
        function renderEvents(data) {
            const container = document.getElementById('events-container');
            container.innerHTML = '';
            data.forEach(ev => {
                let html = `
                <div class="terminal-box">
                    <span class="box-title">${ev.title}</span>
                    <div class="box-text">
                        ${ev.desc ? `<p>${formatText(ev.desc)}</p>` : ''}
                        ${ev.gameplay ? `<div class="step-item"><span class="highlight">OYNANIŞ VE ÖRNEK:</span> <br>${formatText(ev.gameplay)}</div>` : ''}
                        ${ev.reward ? `<div class="step-item"><span class="reward">ÖDÜL SİSTEMİ:</span> <br>${formatText(ev.reward)}</div>` : ''}
                        ${ev.rules ? `<div class="step-item"><span class="danger">⚠️ KURALLAR VE UYARILAR:</span> <br>${formatText(ev.rules)}</div>` : ''}
                    </div>
                </div>`;
                container.innerHTML += html;
            });
        }
        loadData();
    </script>
</body>
</html>
