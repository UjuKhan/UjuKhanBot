<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UjuKhanBot | Watchparty Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @font-face { font-family: 'Hemi Head'; src: url('hemi head bd it.ttf') format('truetype'); font-weight: bold; font-style: italic; }
        :root { --neon-cyan: #00f2ff; --neon-pink: #e91e63; --neon-gold: #ffd700; --neon-purple: #bc13fe; --neon-green: #00ff88; --bg-dark: #05070a; --main-font: 'Hemi Head', sans-serif; }
        body { background-color: var(--bg-dark); background-image: radial-gradient(circle at center, #0d121d 0%, #05070a 100%); color: #fff; font-family: var(--main-font); margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; overflow-x: hidden; padding: 40px 20px; box-sizing: border-box; }
        .hub-container { width: 100%; max-width: 1200px; z-index: 2; display: flex; flex-direction: column; align-items: center; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 2px solid rgba(0, 242, 255, 0.2); padding-bottom: 20px; margin-bottom: 30px; }
        .top-nav a { color: #666; text-decoration: none; font-size: 20px; letter-spacing: 2px; transition: all 0.3s; }
        .top-nav a:hover { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        h1 { font-size: 50px; text-shadow: 0 0 20px var(--neon-pink); letter-spacing: 4px; margin: 0 0 30px 0; text-transform: uppercase; font-style: italic; text-align: center; }
        .controls-wrapper { display: flex; flex-direction: column; gap: 20px; width: 100%; margin-bottom: 40px; align-items: center; }
        .filter-container { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .filter-btn { background: rgba(255, 255, 255, 0.02); border: 2px solid rgba(255, 255, 255, 0.1); color: white; font-family: var(--main-font); font-size: 16px; font-style: italic; padding: 8px 20px; border-radius: 10px; cursor: pointer; letter-spacing: 1px; transition: all 0.3s; }
        .filter-btn:hover, .filter-btn.active { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); color: var(--neon-cyan); text-shadow: 0 0 5px rgba(0, 242, 255, 0.5); }
        .search-container { position: relative; width: 100%; max-width: 400px; }
        .search-input { width: 100%; padding: 12px 20px 12px 45px; background: rgba(255, 255, 255, 0.02); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; font-family: 'Segoe UI', sans-serif; font-size: 14px; box-sizing: border-box; transition: all 0.3s; }
        .search-input:focus { border-color: var(--neon-pink); box-shadow: 0 0 15px rgba(233, 30, 99, 0.3); outline: none; }
        .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: rgba(255, 255, 255, 0.3); font-size: 16px; transition: all 0.3s; }
        .search-input:focus + .search-icon { color: var(--neon-pink); }
        .menu-grid { display: flex; gap: 25px; justify-content: flex-start; flex-wrap: wrap; width: 100%; }
        .nav-card { width: 230px; height: 350px; border: 2px solid rgba(0, 242, 255, 0.3); border-radius: 20px; display: flex; align-items: flex-start; justify-content: flex-start; padding: 0; position: relative; overflow: hidden; box-sizing: border-box; cursor: pointer; background-size: 230px 350px; background-repeat: no-repeat; background-position: left center; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s, border-color 0.3s; }
        .nav-card:hover:not(.expanded) { transform: translateY(-5px); border-color: var(--neon-cyan); box-shadow: 0 0 25px rgba(0, 242, 255, 0.2); }
        .nav-card.expanded { width: 650px; border-color: var(--neon-pink); box-shadow: 0 0 35px rgba(233, 30, 99, 0.3); cursor: default; }
        .card-main { width: 230px; height: 100%; display: flex; flex-direction: column; position: relative; z-index: 2; flex-shrink: 0; }
        .status-badge { margin-top: 15px; margin-left: 15px; align-self: flex-start; font-size: 9px; padding: 3px 8px; border-radius: 8px; letter-spacing: 1px; font-weight: bold; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); }
        .complete-badge { color: var(--neon-green); border-color: var(--neon-green); }
        .continue-badge { color: var(--neon-gold); border-color: var(--neon-gold); }
        .plan-badge { color: var(--neon-purple); border-color: var(--neon-purple); }
        .pause-badge { color: #bc13fe; border-color: #bc13fe; } 
        .drop-badge { color: var(--neon-pink); border-color: var(--neon-pink); } 
        .progress-wrapper { width: calc(100% + 4px); margin-left: -2px; margin-right: -2px; margin-bottom: -2px; margin-top: auto; background: linear-gradient(to top, rgba(5, 7, 10, 1) 0%, rgba(5, 7, 10, 0.95) 40%, rgba(5, 7, 10, 0.7) 70%, rgba(5, 7, 10, 0) 100%); padding: 55px 17px 17px 17px; box-sizing: border-box; border-radius: 0 0 18px 18px; }
        .title { font-size: 22px; letter-spacing: 1px; margin: 0 0 8px 0; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
        .progress-text { font-family: 'Segoe UI', sans-serif; font-size: 11px; color: #fff; font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 6px; text-shadow: 1px 1px 2px #000; }
        .progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: var(--neon-gold); box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); border-radius: 3px; transition: width 0.8s ease-in-out; }
        .progress-complete { background: var(--neon-green) !important; box-shadow: 0 0 10px rgba(0, 255, 136, 0.8) !important; }
        .card-details { opacity: 0; visibility: hidden; height: 100%; display: flex; flex-direction: column; justify-content: flex-start; font-family: 'Segoe UI', sans-serif; transition: opacity 0.3s ease, visibility 0.3s ease; transition-delay: 0.2s; width: 420px; position: relative; z-index: 2; background: #0b0f19; border-left: 1px solid rgba(255, 255, 255, 0.05); padding: 15px; box-sizing: border-box; border-radius: 0 18px 18px 0; }
        .nav-card.expanded .card-details { opacity: 1; visibility: visible; }
        .detail-header { font-family: var(--main-font); font-size: 22px; color: var(--neon-pink); font-style: italic; border-bottom: 2px solid rgba(233, 30, 99, 0.2); padding-bottom: 5px; margin-bottom: 15px; text-transform: uppercase; }
        .seasons-scroll-list { display: flex; flex-direction: column; gap: 15px; overflow-y: auto; height: 100%; padding-right: 5px; }
        .seasons-scroll-list::-webkit-scrollbar { width: 3px; }
        .seasons-scroll-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .season-row-item { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .season-row-header { display: flex; justify-content: space-between; align-items: center; }
        .season-row-name { font-family: var(--main-font); font-style: italic; font-size: 16px; color: var(--neon-cyan); letter-spacing: 0.5px; }
        .mini-stars { color: var(--neon-gold); font-size: 12px; text-shadow: 0 0 5px rgba(255, 215, 0, 0.3); }
        .mini-badge { font-size: 9px; padding: 2px 6px; border-radius: 5px; font-weight: bold; background: rgba(0,0,0,0.4); text-transform: uppercase; }
        .season-row-dates { font-size: 11px; color: #aaa; display: flex; gap: 10px; }
        .season-row-note { font-size: 11px; color: #eee; line-height: 1.4; border-top: 1px solid rgba(255,255,255,0.03); padding-top: 6px; }
        .bg-glow { position: fixed; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 255, 0, 0.06)); background-size: 100% 2px, 3px 100%; pointer-events: none; z-index: 1; top: 0; left: 0; }
        .footer { margin-top: 40px; padding: 20px 0; font-size: 11px; letter-spacing: 4px; color: #222; text-transform: uppercase; font-style: italic; z-index: 2; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="hub-container">
        <div class="top-nav"><a href="https://ujukhan.github.io/UjuKhanBot/">← HUB GERI DON</a><div></div></div>
        <h1>WATCHPARTY TRACKER</h1>
        <div class="controls-wrapper">
            <div class="filter-container">
                <button class="filter-btn active" onclick="filterType('hepsi', this)">HEPSI</button>
                <button class="filter-btn" onclick="filterType('anime', this)">ANIME</button>
                <button class="filter-btn" onclick="filterType('dizi', this)">DIZI</button>
                <button class="filter-btn" onclick="filterType('film', this)">FILM</button>
            </div>
            <div class="search-container">
                <input type="text" id="search-box" class="search-input" placeholder="Arşivde canlı ara..." oninput="handleSearch()">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
            </div>
        </div>
        <div class="menu-grid" id="watch-grid"></div>
    </div>
    <div class="footer">UJUKHAN TRACK_CORE // DATA STREAM SECURE</div>
    <script>
        let globalData = [];
        let activeFilter = 'hepsi';
        let searchQuery = '';

        async function loadData() {
            try {
                // Burada yolu belirttik, aynı klasörde olmalı
                const response = await fetch('./watchparty.json'); 
                if (!response.ok) throw new Error("Dosya bulunamadı: " + response.status);
                globalData = await response.json();
                renderGrid();
            } catch (e) { console.error("Hata:", e); }
        }
        function generateStars(rating) {
            let starsHtml = ''; let floor = Math.floor(rating); let half = (rating % 1) !== 0;
            for (let i = 1; i <= 5; i++) {
                if (i <= floor) starsHtml += '<i class="fa-solid fa-star"></i>';
                else if (i === floor + 1 && half) starsHtml += '<i class="fa-solid fa-star-half-stroke"></i>';
                else starsHtml += '<i class="fa-regular fa-star" style="opacity:0.1"></i>';
            }
            return starsHtml;
        }
       function renderGrid() {
    const grid = document.getElementById('watch-grid'); 
    grid.innerHTML = '';
    let groupedMap = {};
    
    globalData.forEach(item => {
        let gName = (item.groupName && item.groupName.trim() !== "") ? item.groupName.toUpperCase() : item.title.toUpperCase();
        if (!groupedMap[gName]) groupedMap[gName] = [];
        groupedMap[gName].push(item);
    });
    
    let cardIndex = 0;
    for (let gName in groupedMap) {
        let items = groupedMap[gName];
        if (activeFilter !== 'hepsi' && items[0].type !== activeFilter) continue;
        if (searchQuery !== '' && !gName.includes(searchQuery)) continue;
        
        items.sort((a, b) => (parseFloat(a.season) || 0) - (parseFloat(b.season) || 0));
        
        let totalCurrent = 0, totalMax = 0, hasDevam = false, hasPlan = false, hasAra = false, hasBıraktı = false, hasBitti = false;
        
        items.forEach(item => {
            totalCurrent += parseInt(item.current) || 0; 
            totalMax += parseInt(item.total) || 0;
            if (item.status === "devam") hasDevam = true; 
            if (item.status === "plan") hasPlan = true;
            if (item.status === "ara") hasAra = true; 
            if (item.status === "bıraktı") hasBıraktı = true;
            if (item.status === "bitti" || item.type === "film") hasBitti = true;
        });
        
        let percentage = totalMax > 0 ? Math.min(Math.round((totalCurrent / totalMax) * 100), 100) : 0;
        let badgeClass = "status-badge continue-badge", badgeText = "DEVAM EDIYOR", barClass = "progress-bar-fill";
        
        if (percentage === 100 || (hasBitti && !hasDevam && !hasAra)) { 
            badgeClass = "status-badge complete-badge"; badgeText = "BITTI"; barClass = "progress-bar-fill progress-complete"; 
        } else if (hasBıraktı && !hasDevam) { 
            badgeClass = "status-badge drop-badge"; badgeText = "BIRAKILDI"; barClass = "progress-bar-fill progress-drop"; 
        } else if (hasAra && !hasDevam) { 
            badgeClass = "status-badge pause-badge"; badgeText = "ARA VERILDI"; 
        } else if (hasPlan && !hasDevam && !hasBitti) { 
            badgeClass = "status-badge plan-badge"; badgeText = "PLANLANIYOR"; 
        }
        
        // Burayı değiştirdik: "ÖĞE" yerine dinamik etiket
        let labelText = (items[0].type === "film") ? "1 FİLM" : items.length + " SEZON";
        
        let subItemsHtml = '';
        items.forEach(sub => {
            let subPerc = sub.type === "film" || sub.status === "bitti" ? 100 : Math.min(Math.round((sub.current / sub.total) * 100), 100);
            let subBadgeText = sub.status === "bitti" || sub.type === "film" ? "BİTTİ" : sub.status.toUpperCase();
            if(sub.status === "ara") subBadgeText = "MOLA"; if(sub.status === "plan") subBadgeText = "YAKINDA";
            let subBadgeStyle = "color: var(--neon-gold);";
            if (subPerc === 100) subBadgeStyle = "color: var(--neon-green);"; if (sub.status === "plan") subBadgeStyle = "color: var(--neon-purple);"; if (sub.status === "bıraktı") subBadgeStyle = "color: var(--neon-pink);";
            let subDateText = sub.status === "plan" ? `Hedef: ${sub.startDate}` : `Başlangıç: ${sub.startDate} | Bitiş: ${sub.endDate}`;
            subItemsHtml += `<div class="season-row-item"><div class="season-row-header"><span class="season-row-name">${sub.type === 'film' ? 'TEK PARÇA FİLM' : 'SEZON ' + sub.season}</span><div class="mini-stars">${generateStars(sub.rating || 0)}</div><span class="mini-badge" style="${subBadgeStyle}">${subBadgeText} (${sub.current}/${sub.total})</span></div><div class="season-row-dates">${subDateText}</div>${sub.note ? `<div class="season-row-note">${sub.note}</div>` : ''}</div>`;
        });
        
        grid.innerHTML += `<div class="nav-card" id="card-${cardIndex}" style="background-image: url('${items[0].image || 'https://via.placeholder.com/230x350/000'}')" onclick="expandCard(${cardIndex}, event)">
            <div class="card-main">
                <div class="${badgeClass}">${badgeText}</div>
                <div class="progress-wrapper">
                    <div class="title">${gName}</div>
                    <div class="progress-text">
                        <span>${labelText}</span>
                        <span>%${percentage}</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="${barClass}" style="width: ${percentage}%"></div>
                    </div>
                </div>
            </div>
            <div class="card-details">
                <div class="detail-header">İZLEME BİLGİSİ</div>
                <div class="seasons-scroll-list">${subItemsHtml}</div>
            </div>
        </div>`;
        cardIndex++;
    }
}
        function expandCard(index, event) { if (event.target.closest('.card-details')) return; const card = document.getElementById(`card-${index}`); const isExpanded = card.classList.contains('expanded'); document.querySelectorAll('.nav-card').forEach(c => c.classList.remove('expanded')); if (!isExpanded) card.classList.add('expanded'); }
        function filterType(type, button) { activeFilter = type; document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active')); button.classList.add('active'); renderGrid(); }
        function handleSearch() { searchQuery = document.getElementById('search-box').value.trim().toUpperCase(); renderGrid(); }
        loadData();
    </script>
</body>
</html>
