<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>UjuKhanBot Market</title>
    <style>
        @font-face { font-family: 'Hemi Head'; src: url('hemi head bd it.ttf'); }
        :root { 
            --ana: #00f2ff; 
            --altin: #ffd700; 
            --neon-pink: #e91e63;
            --bg: #06090f; 
            --font: 'Hemi Head', sans-serif; 
        }
        * { font-family: var(--font) !important; box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: #fff; 
            padding: 50px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }

        /* FİLTRE BUTONLARI İÇİN CSS (WATCHPARTY'DEN UYARLANDI) */
        .controls-wrapper { display: flex; flex-direction: column; gap: 20px; width: 100%; margin-bottom: 40px; align-items: center; }
        .filter-container { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .filter-btn { background: rgba(255, 255, 255, 0.02); border: 2px solid rgba(255, 255, 255, 0.1); color: white; font-size: 16px; font-style: italic; padding: 8px 20px; border-radius: 10px; cursor: pointer; letter-spacing: 1px; transition: all 0.3s; }
        .filter-btn:hover, .filter-btn.active { border-color: var(--altin); box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); color: var(--altin); text-shadow: 0 0 5px rgba(255, 215, 0, 0.5); }

        .market-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 30px; 
            width: 100%; 
            max-width: 1200px; 
        }
        .item-card { 
            background: #11151c; 
            border: 2px solid #2a3241; 
            border-radius: 25px; 
            padding: 35px; 
            text-align: center; 
            transition: 0.4s; 
        }
        .item-card:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 15px 35px rgba(0, 242, 255, 0.1); 
        }
        .item-card img { 
            width: 180px; 
            height: 180px; 
            object-fit: contain; 
            margin-bottom: 20px; 
        }
        .item-price { 
            background: var(--altin); 
            color: #000; 
            padding: 10px 30px; 
            border-radius: 50px; 
            font-weight: bold; 
            font-size: 22px; 
            display: inline-block;
        }
        .cmd-box { 
            margin-top: 30px; 
            background: rgba(0, 255, 136, 0.05); 
            padding: 12px; 
            border-radius: 10px; 
            color: #00ff88; 
            border: 1px solid rgba(0, 255, 136, 0.2); 
        }
    </style>
</head>
<body>
    <div style="text-align:center; margin-bottom:30px;">
        <h1 style="font-size:60px; color:var(--altin); margin:0;">UJUKHANBOT MARKET</h1>
        <p style="color:var(--ana); letter-spacing:2px;">PUANLARINI HARCAMAK İÇİN CHATTE KOMUTUNU KULLAN</p>
    </div>

    <div class="controls-wrapper">
        <div class="filter-container" id="filter-container">
            </div>
    </div>

    <div id="reyon" class="market-grid"></div>

    <script>
        let globalMarketData = [];
        let activeFilter = 'HEPSI';

        async function loadData() {
            try {
                const response = await fetch('./market.json');
                if (!response.ok) throw new Error("Dosya bulunamadı");
                globalMarketData = await response.json();
                renderFilters();
                renderMarket();
            } catch(e) { console.error("market.json yüklenemedi: ", e); }
        }

        // Grupları JSON'dan okuyup otomatik buton oluşturur
        function renderFilters() {
            const container = document.getElementById('filter-container');
            
            // Tüm benzersiz grupları topla (Grup yoksa "DİĞER" yap)
            let groups = [...new Set(globalMarketData.map(item => item.group ? item.group.toUpperCase() : 'DİĞER'))];
            
            // Önce HEPSİ butonu
            let html = `<button class="filter-btn active" onclick="filterType('HEPSI', this)">HEPSİ</button>`;
            
            // Sonra diğer grupların butonları
            groups.forEach(g => {
                if(g.trim() !== '') {
                    html += `<button class="filter-btn" onclick="filterType('${g}', this)">${g}</button>`;
                }
            });
            container.innerHTML = html;
        }

        // Filtreye tıklandığında çalışır
        function filterType(type, btn) {
            activeFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMarket();
        }

        // Reyonu ekrana basar (Kutu renklerini bir mavi bir kırmızı yapar)
        function renderMarket() {
            const reyon = document.getElementById('reyon');
            reyon.innerHTML = '';
            
            // Filtreleme işlemi
            let filtered = activeFilter === 'HEPSI' 
                ? globalMarketData 
                : globalMarketData.filter(i => (i.group || 'DİĞER').toUpperCase() === activeFilter);
            
            // Kartları çizdir
            filtered.forEach((u, index) => {
                // Renk mantığı: Çift sayılar mavi, tek sayılar kırmızı (orijinal isteğin)
                let dinamikRenk = (index % 2 === 0) ? "#00f2ff" : "#ff4d4d";

                reyon.innerHTML += `
                    <div class="item-card" style="border-color: ${dinamikRenk}">
                        <img src="${u.gif}" onerror="this.src='https://via.placeholder.com/180/11151c/00f2ff?text=RESIM+YOK'">
                        <span style="display:block; font-size:28px; color:${dinamikRenk}; margin-bottom:15px;">${u.ad}</span>
                        <p style="color:rgba(255,255,255,0.5); margin-bottom:25px; height:45px; overflow:hidden;">${u.desc}</p>
                        <span class="item-price">${u.fiyat} 💰</span>
                        <div class="cmd-box" style="color:${dinamikRenk}; border-color:${dinamikRenk}66">
                            <small style="display:block; opacity:0.3; font-size:10px;">KOMUT:</small>${u.cmd}
                        </div>
                    </div>`;
            });
        }
        
        loadData();
    </script>
</body>
</html>
